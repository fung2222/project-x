<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#005d71">
<link rel="icon" type="image/svg+xml" href="img/icon-32.svg">
<link rel="apple-touch-icon" href="img/icon-180.png">
<title>總覽 · Project X</title>
<link rel="stylesheet" href="css/style.css?v=20261109-2">
</head>
<body>
<div id="px-header"></div>
<main><h1 class="page-title">投資總覽</h1><p class="page-subtitle">先睇真倉同風險，再睇研究機會。紙上組合只係對照組，所有名單均唔係買入建議。</p><div id="content" tabindex="-1"><div class="loading">載入中…</div></div></main>
<div id="px-footer"></div>
<script src="js/px.js?v=20261109-2"></script>
<script>
PX.nav();
(async () => {
  const [pf, rep, scan, hist, idx, futu, rsn] = await Promise.all([PX.json('portfolio.json'), PX.json('daily_report.json'),
    PX.json('data/scan.json'), PX.json('data/pnl_history.json'), PX.json('data/reports_index.json'), PX.json('data/futu_positions.json'), PX.json('data/reasons.json')]);
  const a = (pf && pf.account) || {}; const fx = a.fx_usdhkd || 7.8; const mk = (rep && rep.market) || {};
  PX.setUpdated(`更新：${(rep && (rep.timestamp || rep.date)) || '—'}`);
  const pos = (pf && pf.positions) || [];
  const top = ((scan && scan.top) || []).slice(0, 3);
  const h = hist || [];
  const reports = ((idx && idx.reports) || []).slice(-4).reverse();
  document.getElementById('content').innerHTML = `
    ${PX.freshness(rep && rep.timestamp, 30, '每日分析')}
    ${PX.realCard(futu, fx, {compact: true, reasons: rsn})}
    <section class="stats" aria-label="紙上組合與市場摘要">
      <div class="stat"><div class="stat-label">紙上權益</div><div class="stat-value">${PX.usd(a.equity_usd)}</div><div class="muted">${PX.hkd(a.equity_usd * fx)}</div></div>
      <div class="stat"><div class="stat-label">紙上總回報（已計費用＋FX）</div><div class="stat-value ${PX.cls(a.total_pnl_usd)}">${PX.pct(a.total_return_pct)}</div><div class="muted">${PX.usd(a.total_pnl_usd)}</div></div>
      <div class="stat"><div class="stat-label">紙上現金</div><div class="stat-value">${Number(a.cash_pct || 0).toFixed(1)}%</div><div class="muted">${PX.usd(a.cash_usd)} · 下限 20%</div></div>
      <div class="stat"><div class="stat-label">市場波幅 VIX</div><div class="stat-value">${mk.vix ?? '—'}</div><div class="muted">${PX.esc(mk.regime || '')}</div></div>
    </section>
    <nav class="model-links" aria-label="研究模型">
      <a class="model-link" href="opportunities.html"><span class="model-number">01</span><span><strong>動能／突破</strong><small>細中型股研究名單，評分只供排序</small></span><span class="model-arrow" aria-hidden="true">→</span></a>
      <a class="model-link" href="pullback.html"><span class="model-number">02</span><span><strong>大型藍籌回調</strong><small>45 隻藍籌，四條件同時符合先列入</small></span><span class="model-arrow" aria-hidden="true">→</span></a>
    </nav>
    <div class="home-layout"><div class="home-primary">
      <section class="section-block"><div class="section-heading"><div><div class="eyebrow">MOMENTUM RESEARCH</div><h2>突破研究精選</h2></div><a href="opportunities.html">完整名單 →</a></div>
        <p class="section-subtitle">${PX.esc(scan && scan.bar_date || '')} 收市數據 · 最多顯示 3 個研究對象 · 未證明有回測優勢</p>
        ${top.length ? top.map((x, i) => PX.oppCard(x, i, fx, {compact: true})).join('') : '<div class="empty">今日冇股票同時過晒趨勢、流動性同 R:R 條件。唔入場都係決定。</div>'}
      </section>
      <section class="card"><div class="section-heading"><div><div class="eyebrow">PAPER PORTFOLIO</div><h2>權益曲線 vs SPY</h2></div><a href="portfolio.html">組合詳情 →</a></div><div class="chart">${h.length > 1 ? PX.lineChart([h.map(x => x.equity_usd), h.map(x => x.spy_close ? x.spy_close / h[0].spy_close * h[0].equity_usd : null)], h.map(x => x.date)) : '<div class="empty">未夠數據</div>'}</div><p class="muted">深青：紙上權益；灰：SPY 同起點換算。2026-09-13 起。</p></section>
    </div><aside class="home-secondary">
      <section class="card"><div class="eyebrow">MARKET SNAPSHOT</div><h2>市場快照</h2><div class="market-list">
        <div class="market-row"><span>VIX 波幅</span><b>${mk.vix ?? '—'}</b></div><div class="market-row"><span>SPY 每日變幅</span><b class="${PX.cls(mk.spy_change)}">${PX.pct(mk.spy_change)}</b></div><div class="market-row"><span>QQQ 每日變幅</span><b class="${PX.cls(mk.qqq_change)}">${PX.pct(mk.qqq_change)}</b></div>
      </div><p class="market-note">大市背景只用嚟調整風險，唔用嚟保證個股方向。</p></section>
      <section class="card"><div class="section-heading compact"><h2>紙上持倉</h2><span class="section-meta">${pos.length}/3 · 對照組</span></div>${pos.length ? pos.map(p => `<div class="position-row"><div class="position-top"><div><div class="position-name"><b>${PX.esc(p.ticker)}</b></div><div class="position-detail">${p.shares} 股 @ ${PX.usd(p.entry_price)} · 現 ${PX.usd(p.current_price)}</div></div><div class="${PX.cls(p.pnl_pct)} position-pnl">${PX.pct(p.pnl_pct)}</div></div><div class="position-detail">止蝕 ${PX.usd(p.stop_loss_price)}（距 ${p.dist_to_sl_pct ?? '—'}%）· 止賺 ${PX.usd(p.take_profit_price)}</div></div>`).join('') : '<div class="empty">目前空倉</div>'}</section>
      <section class="card"><div class="section-heading compact"><h2>最新報告</h2><a href="reports.html">全部 →</a></div>${reports.length ? reports.map(r => `<a class="report-mini" href="data/${PX.esc(r.file)}"><b>${PX.esc(r.date)} · ${PX.esc(r.kind_zh || r.kind)}</b><span>${PX.esc(r.summary || '')}</span></a>`).join('') : '<div class="empty">報告會喺排程執行後累積</div>'}</section>
    </aside></div>`;
  PX.enhanceTables(document.getElementById('content'));
})();
</script></body></html>
