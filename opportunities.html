<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#005d71">
<link rel="icon" type="image/svg+xml" href="img/icon-32.svg">
<link rel="apple-touch-icon" href="img/icon-180.png">
<title>突破研究 · Project X</title>
<link rel="stylesheet" href="css/style.css?v=20261109-2">
</head>
<body>
<div id="px-header"></div>
<main><h1 class="page-title">動能／突破研究</h1><p class="page-subtitle">用統一規則篩出值得進一步研究嘅細中型股。分數只供排序，唔代表勝率，亦唔係買入訊號。</p><div id="content" tabindex="-1"><div class="loading">載入中…</div></div></main>
<div id="px-footer"></div>
<script src="js/px.js?v=20261109-2"></script>
<script>
PX.nav();
(async () => {
  const [scan, bt, pf] = await Promise.all([PX.json('data/scan.json'), PX.json('data/backtest/scan_variants_2026-09-28.json'), PX.json('portfolio.json')]);
  const fx = (scan && scan.fx_usdhkd) || 7.8;
  PX.setUpdated(`掃描：${(scan && scan.generated_at) || '—'}`);
  if (!scan) { document.getElementById('content').innerHTML = '<div class="empty">未有掃描數據（收市報告／每日分析會生成）</div>'; return; }
  const live = bt && bt.live; const sl = live && live.signal_level; const ps = live && live.portfolio_sim; const bm = live && live.benchmarks;
  const all = scan.all || [];
  document.getElementById('content').innerHTML = `
    ${PX.freshness(scan.generated_at, 30, '機會掃描')}
    <section class="research-banner"><div class="eyebrow">DAILY SCAN</div><h2>今日掃描摘要</h2><p>呢套模型同大型藍籌回調完全獨立。只有同時通過流動性、趨勢、位置、R:R 同組合限制嘅股票先會列入。</p><div class="research-meta"><span>掃描 ${scan.scanned} 隻</span><span>${scan.passed} 隻通過</span><span>每注風險上限 ${PX.usd(scan.risk_per_trade_usd, 0)}</span><span>${PX.esc(scan.bar_date)} 收市數據</span></div></section>
    <section class="section-block"><div class="section-heading"><div><div class="eyebrow">RESEARCH SHORTLIST</div><h2>優先研究名單</h2></div><span class="section-meta">Top ${(scan.top || []).length} · 只供研究</span></div>
      ${(scan.top || []).length ? scan.top.map((x, i) => PX.oppCard(x, i, fx)).join('') : '<div class="empty">今日冇名單。唔為咗有交易而放低標準。</div>'}
      ${(scan.near_misses || []).length ? `<p class="muted section-note">差少少：${scan.near_misses.map(m => `${PX.esc(m.ticker)}（${PX.esc((m.fail || [])[0])}）`).join('；')}</p>` : ''}</section>
    <details class="card detail-card"><summary>篩選規則與風險口徑</summary><div class="detail-body"><p>20 日平均成交額 ≥ US$20M、股價 ≥ $2、交易所上市（冇 OTC）、每注 ≤ 25%（${PX.usd(scan.max_position_usd, 0)}）兼買得起 ≥ 2 股、價 &gt; MA50、R:R ≥ 2、離 MA20 ≤ 3 ATR、業績前 5 個交易日唔開新倉、每個主題最多 1 隻。</p><p class="muted">「模擬注碼」只係預算參考。實盤前要重新按可用現金、來回費用同可承受虧損計算。</p></div></details>
    <details class="card detail-card"><summary>回測結果、手續費影響與限制</summary><div class="detail-body">${live ? `
      <p>期間 ${PX.esc(live.period.from)} → ${PX.esc(live.period.to)}（${live.period.trading_days} 個交易日），同一套規則，下一日開市價入場。</p>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>方案</th><th>次數</th><th>勝率</th><th>命中目標</th><th>平均 R</th><th>最大回撤（R）</th></tr></thead><tbody>
      <tr><td>每日 Top 1</td><td>${sl.top1_each_day.n}</td><td>${(sl.top1_each_day.win_rate * 100).toFixed(0)}%</td><td>${(sl.top1_each_day.target_hit_rate * 100).toFixed(0)}%</td><td>${sl.top1_each_day.avg_r}</td><td>${sl.top1_each_day.max_drawdown_r}</td></tr>
      <tr><td>每日 Top 5</td><td>${sl.top5_each_day.n}</td><td>${(sl.top5_each_day.win_rate * 100).toFixed(0)}%</td><td>${(sl.top5_each_day.target_hit_rate * 100).toFixed(0)}%</td><td>${sl.top5_each_day.avg_r}</td><td>${sl.top5_each_day.max_drawdown_r}</td></tr>
      <tr><td>基準：所有流動股（冇評分）</td><td>${sl.baseline_all_liquid_names_same_exits.n}</td><td>${(sl.baseline_all_liquid_names_same_exits.win_rate * 100).toFixed(0)}%</td><td>${(sl.baseline_all_liquid_names_same_exits.target_hit_rate * 100).toFixed(0)}%</td><td>${sl.baseline_all_liquid_names_same_exits.avg_r}</td><td>${sl.baseline_all_liquid_names_same_exits.max_drawdown_r}</td></tr></tbody></table></div>
      <p class="section-note">組合模擬（US$1,280、最多 3 隻、每日最多 1 次開倉、計手續費）：<b class="${PX.cls(ps.return_pct)}">${PX.pct(ps.return_pct)}</b>，最大回撤 ${PX.pct(ps.max_drawdown_pct)}，${ps.trades} 單，勝率 ${(ps.win_rate * 100).toFixed(0)}%。同期 QQQ ${PX.pct(bm.QQQ_buy_hold_pct_and_mdd[0])}（回撤 ${PX.pct(bm.QQQ_buy_hold_pct_and_mdd[1])}）、SPY ${PX.pct(bm.SPY_buy_hold_pct_and_mdd[0])}、股票池平均持有 ${PX.pct(bm.universe_equal_weight_buy_hold_pct)}。</p>
      ${bt.live_oldfees && bt.fee_totals_closed_trades ? `<p>手續費影響：富途真實收費（每張單約 US$2，來回約 US$4）下，已平倉 ${bt.fee_totals_closed_trades.live.closed_trades} 單手續費共 <b>${PX.usd(bt.fee_totals_closed_trades.live.fees_usd)}</b>（約本金 ${(bt.fee_totals_closed_trades.live.fees_usd / 1280 * 100).toFixed(0)}%）；未計手續費嘅盈虧 ${PX.usd(bt.fee_totals_closed_trades.live.gross_pnl_usd)}。舊 US$1 收費模型會令同一規則變成 ${PX.pct(bt.live_oldfees.portfolio_sim.return_pct)}，顯示結果對費用非常敏感。</p>` : ''}
      <div class="fresh-warn section-note"><strong>回測結論</strong>　呢套掃描喺過去一年冇證明到有優勢，計返真實手續費仲係蝕錢，大幅跑輸 QQQ 買入持有。倖存者偏差、冇模擬業績日、日線次序未知；詳見 docs/AUDIT.md §6。</div>` : '<div class="empty">未有回測數據</div>'}</div></details>
    <details class="card detail-card"><summary>全部掃描結果（${all.length} 隻）</summary><div class="detail-body"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>股票</th><th>機會評分</th><th>過濾</th><th>價</th><th>RSI</th><th>R:R</th><th>vs QQQ 20/60日</th><th>成交額</th><th>業績日</th><th>未過原因</th></tr></thead><tbody>
      ${all.map(x => `<tr><td><b>${PX.esc(x.ticker)}</b> <span class="muted">${PX.esc(x.theme || '')}</span></td><td>${x.score ?? '—'}</td><td>${x.pass ? '<span class="badge badge-ok">通過</span>' : '<span class="badge badge-bad">未過</span>'}</td><td>${PX.usd(x.close)}</td><td>${x.rsi ?? '—'}</td><td>${x.rr ?? '—'}</td><td>${x.ex_qqq_20d_pp ?? '—'} / ${x.ex_qqq_60d_pp ?? '—'}</td><td>${x.dollar_vol20_musd != null ? '$' + x.dollar_vol20_musd + 'M' : '—'}</td><td>${PX.esc(x.earnings_date || '—')}</td><td class="muted">${PX.esc((x.fail || []).join('；'))}</td></tr>`).join('')}</tbody></table></div></div></details>`;
  PX.enhanceTables(document.getElementById('content'));
})();
</script></body></html>
