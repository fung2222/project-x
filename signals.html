<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#005d71">
<link rel="icon" type="image/svg+xml" href="img/icon-32.svg">
<link rel="apple-touch-icon" href="img/icon-180.png">
<title>信號 · Project X</title>
<link rel="stylesheet" href="css/style.css?v=20261109-2">
</head>
<body>
<div id="px-header"></div>
<main><h1 class="page-title">每日信號</h1><p class="page-subtitle">核心股與次要股嘅規則輸出，集中睇趨勢、信心、成交量同風險條件。信號唔保證升跌。</p><div id="content" tabindex="-1"><div class="loading">載入中…</div></div></main>
<div id="px-footer"></div>
<script src="js/px.js?v=20261109-2"></script>
<script>
PX.nav();
(async () => {
  const [rep, scan] = await Promise.all([PX.json('daily_report.json'), PX.json('data/scan.json')]);
  if (!rep) { document.getElementById('content').innerHTML = '<div class="empty">未有每日分析</div>'; return; }
  PX.setUpdated(`更新：${rep.timestamp || rep.date}`);
  const earn = {}; ((scan && scan.all) || []).forEach(x => { if (x.earnings_date) earn[x.ticker] = x.earnings_date; });
  const row = s => { const ind = s.indicators || {}; const ed = s.earnings_date || earn[s.ticker];
    return `<tr><td><b>${PX.esc(s.ticker)}</b>${s.is_owned ? ' <span class="badge badge-ok">持有</span>' : ''}</td><td>${PX.usd(s.price)}</td><td class="${PX.cls(s.change_pct)}">${PX.pct(s.change_pct)}</td>
    <td>${PX.esc(s.signal)}</td><td>${s.confidence ?? '—'}%</td><td>${s.rsi ?? '—'}</td><td>${s.trend_score != null ? (s.trend_score > 0 ? '+' : '') + s.trend_score : '—'} ${PX.esc(s.trend_label || '')}</td>
    <td>${ind.price_vs_ma20_pct != null ? PX.pct(ind.price_vs_ma20_pct, 1) : '—'} / ${ind.price_vs_ma50_pct != null ? PX.pct(ind.price_vs_ma50_pct, 1) : '—'}</td>
    <td>${s.vol_ratio ?? '—'}</td><td>${PX.esc(ed ? String(ed).slice(0, 10) : '—')}</td><td class="muted">${PX.esc((s.reasons || []).join('；'))}</td></tr>`; };
  const head = '<thead><tr><th>股票</th><th>價</th><th>變幅</th><th>信號</th><th>信心</th><th>RSI</th><th>趨勢</th><th>vs MA20/MA50</th><th>量比</th><th>業績日</th><th>理由</th></tr></thead>';
  const v3 = rep.v3 || {};
  document.getElementById('content').innerHTML = `
    ${PX.freshness(rep.timestamp, 30, '每日分析')}
    <section class="card info-card"><div class="eyebrow">RULE-BASED OUTPUT</div><h2>點樣睇信號</h2><p>${PX.esc(rep.data_note || '')}</p><p>買入門檻：信心 ≥ ${Math.round(((rep.guardrail || {}).min_confidence || 0.75) * 100)}%，仲要通過 setup、成交量、趨勢、組合限制同冷靜期。任何一項未過都唔應視作入場依據。</p></section>
    <section class="card"><div class="section-heading compact"><h2>核心與次要股</h2><span class="section-meta">${(rep.signals || []).length} 隻 · 已收市數據</span></div><div class="tbl-wrap"><table class="tbl">${head}<tbody>${(rep.signals || []).map(row).join('')}</tbody></table></div></section>
    ${(rep.opportunity_signals || []).length ? `<details class="card detail-card"><summary>舊機會名單信號（RSI 模型，${rep.opportunity_signals.length} 隻）</summary><div class="detail-body"><div class="tbl-wrap"><table class="tbl">${head}<tbody>${rep.opportunity_signals.map(row).join('')}</tbody></table></div></div></details>` : ''}
    <div class="content-grid">
      ${v3.teaching ? `<section class="card"><div class="eyebrow">DAILY LESSON</div><h2>今日教學</h2><p>${PX.esc(v3.teaching)}</p></section>` : ''}
      ${v3.scenarios ? `<section class="card"><div class="eyebrow">SCENARIOS</div><h2>情境分析</h2><p><b>基準</b>：${PX.esc(v3.scenarios.base)}</p><p><b>樂觀</b>：${PX.esc(v3.scenarios.bull)}</p><p><b>悲觀</b>：${PX.esc(v3.scenarios.bear)}</p>${(v3.invalidation || []).length ? `<p><b>失效條件</b>：${v3.invalidation.map(PX.esc).join('；')}</p>` : ''}<p class="muted section-note">情境唔係預測保證，只係事先寫低嘅應對框架。</p></section>` : ''}
    </div>
    ${v3.gates ? `<details class="card detail-card"><summary>專業過濾（gates）與未通過原因</summary><div class="detail-body">${(v3.decisions && v3.decisions.skipped || []).map(x => `<div class="position-row"><b>${PX.esc(x.ticker)}</b> <span class="badge">${x.confidence}%</span><div class="position-detail">${PX.esc(x.why)}</div></div>`).join('') || '<div class="empty">今日冇 BUY 候選</div>'}</div></details>` : ''}`;
  PX.enhanceTables(document.getElementById('content'));
})();
</script></body></html>
